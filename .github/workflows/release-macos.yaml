on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull submodules
        run: git submodule update --init --recursive
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # main
      - name: Install dependencies
        run: |
          brew install meson ninja
      - name: Build
        run: |
          LDFLAGS='static' meson setup build --debug --warnlevel 3 --werror -Dcpp_debugstl=true
          ninja -C build
      - name: Test
        run: |
          ninja -C build test
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mv build/oicompare oicompare-arm64
          gh release upload "$TAG" oicompare-arm64
